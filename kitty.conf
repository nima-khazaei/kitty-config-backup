shell /usr/bin/zsh

background_opacity 0.8
dynamic_background_opacity yes

#startup_session none
#initial_window_width 100c
#initial_window_height 100c
#start_as_fullscreen yes

mouse_hide_wait -5.0


remember_window_size yes
remember_window_position no
hide_window_decorations yes
scrollback_pager_history_size 5


notify_on_cmd_finish invisible 30
#window_logo_path /home/winniethepooh/Pictures/wallpapers/anime-girl-demon-horn-with-glasses-8k-wallpaper-uhdpaper.com-612@0@j.jpg

cursor_trail 200
cursor_trail_decay 0.05 0.2
cursor_trail_start_threshold 2


tab_bar_edge bottom
tab_bar_margin_width 1.0
tab_bar_margin_height 1.0
tab_bar_style powerline
tab_powerline_style round
tab_bar_min_tabs 1


# BEGIN_KITTY_FONTS
font_family      family=Hack postscript_name=Hack-Regular
font_size        15.0
bold_font        auto
italic_font      auto
bold_italic_font auto
# END_KITTY_FONTS


map f11 toggle_fullscreen
